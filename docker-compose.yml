services:
  infradev-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infradev-website
    image: infradev/website:latest
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.infradev.description=InfraDev Static Website"
      - "com.infradev.version=1.0"
